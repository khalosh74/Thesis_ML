name: Release Gate

# Validation for the current release-governed pipeline.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and release tooling
        run: python -m pip install -e ".[dev]" build twine
      - name: Verify candidate run and promotion
        run: python -m pytest -q tests/test_release_demo_smoke.py tests/test_release_scope_demo_smoke.py
      - name: Build distributions
        run: python -m build --sdist --wheel
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: thesis-ml-distributions
          path: dist/*
